<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 信息传输控制台</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-256.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f6cbd">
<style>
  :root {
    --bg: #f3f3f3;
    --card: #fbfbfb;
    --card-2: #ffffff;
    --line: #e3e3e3;
    --line-strong: #d6d6d6;
    --text: #1b1b1b;
    --text-dim: #6b6b6b;
    --accent: #0f6cbd;
    --accent-soft: #e5f0fa;
    --err: #b4322b;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-wrap { width: 100%; max-width: 380px; }

  .login-card {
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 32px 28px 26px;
    margin: 0;
  }

  .login-card h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: .2px;
  }

  .login-card > p {
    margin: 0 0 22px;
    color: var(--text-dim);
    font-size: 13px;
  }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .field input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }

  .field input:focus {
    background: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .field input:-webkit-autofill {
    -webkit-box-shadow: 0 0 0 1000px #fff inset;
    -webkit-text-fill-color: var(--text);
  }

  .login-err {
    min-height: 18px;
    margin: 2px 0 12px;
    font-size: 12.5px;
    color: var(--err);
    line-height: 1.4;
  }

  .btn {
    font-family: inherit;
    font-size: 14px;
    border: 1px solid var(--line-strong);
    background: var(--card);
    color: var(--text);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .15s, border-color .15s, opacity .15s;
  }

  .btn:hover { background: var(--hover, #f0f0f0); }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .btn.primary:hover { filter: brightness(1.06); }

  .btn.block { display: block; width: 100%; height: 42px; }

  .btn:disabled { opacity: .6; cursor: default; filter: none; }
</style>
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="form" autocomplete="off">
    <h1>信息传输控制台</h1>
    <p>请输入控制端账号密码</p>
    <div class="field">
      <label for="u">账号</label>
      <input id="u" name="username" value="admin" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="p">密码</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required autofocus>
    </div>
    <div class="login-err" id="err"></div>
    <button class="btn primary block" id="btn" type="submit">登录</button>
  </form>
</div>
<script>
const form = document.getElementById('form');
const err = document.getElementById('err');
const btn = document.getElementById('btn');
form.onsubmit = async (ev) => {
  ev.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('u').value.trim(),
        password: document.getElementById('p').value,
      }),
      credentials: 'same-origin',
    });
    const j = await r.json().catch(() => null);
    if (j && j.ok) { location.href = '/'; return; }
    err.textContent = (j && j.error) || '登录失败';
  } catch (e) {
    err.textContent = '网络错误：' + e.message;
  }
  btn.disabled = false;
  btn.textContent = '登录';
};
</script>
</body>
</html>
